services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work redis --tries=3 --verbose
    volumes:
      - ./backend:/var/www
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smartbancs
      POSTGRES_USER: smartbancs
      POSTGRES_PASSWORD: smartbancs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: